#####################################
############### Setup ###############
#####################################
stages:
  - lint
  - static_analysis
  - test
  - build
  - release

variables:
  RELEASE_TAG: release-$CI_PIPELINE_IID
  MYSQL_ROOT_PASSWORD: team3
  MYSQL_DATABASE: march_madness_betting
  MYSQL_USER: root
  MYSQL_HOST: db
  MYSQL_PORT: 3306
  DATABASE_URL: mysql+pymysql://root:team3@db:3306/march_madness_betting

#####################################
############## Services #############
#####################################
services:
  - name: docker:did
    alias: docker

#####################################
############## Linting ##############
#####################################
lint_backend:
  stage: lint
  image: python
  before_script:
    - pip install -r src/backend/requirements.txt
    - pip install black 
    - pip install flake8
  script:
    - set +e
    - black ./src/backend --check --verbose --diff --color
    - flake8 ./src/backend --max-line-length=88
  tags:
    - dind
  allow_failure: true

lint_frontend:
  stage: lint
  image: node:18
  before_script:
    - cd src/frontend-mm_app
    - npm install
  script:
    - set +e
    - npm run lint
  tags:
    - dind
  allow_failure: true

#####################################
########## Static Analysis ##########
#####################################
static_analysis_backend:
  stage: static_analysis
  image: python:3.9
  before_script:
    - pip install -r src/backend/requirements.txt
    - pip install mypy
  script:
    - mypy src/backend
  tags:
    - dind
  allow_failure: true

#####################################
############## Testing ##############
#####################################
test_backend:
  stage: test
  image: python:3.9
  services:
    - name: mysql:latest
      alias: db
      command: [ "--default-authentication-plugin=mysql_native_password" ]
  before_script:
    - pip install -r src/backend/requirements.txt
    - sleep 10  # Give MySQL time to initialize
    - python -m flask db upgrade  # Apply migrations
  script:
    - npm run --prefix .\src\integration-tests\tests
  tags:
    - dind
  allow_failure: true

test_frontend:
  stage: test
  image: node:18
  before_script:
    - cd src/frontend-mm_app
    - npm install
  script:
    - npm test -- --coverage
  tags:
    - dind
  allow_failure: true

#####################################
############## Build ################
#####################################
docker_compose:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script: 
    - docker-compose up --build
  allow_failure: true

