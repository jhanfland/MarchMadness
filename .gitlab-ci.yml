#####################################
############### Setup ###############
#####################################
stages:
  - lint
  - static_analysis
  - test
  - build
  - release

variables:
  RELEASE_TAG: release-$CI_PIPELINE_IID
  MYSQL_ROOT_PASSWORD: team3
  MYSQL_DATABASE: march_madness_betting
  MYSQL_USER: root
  MYSQL_HOST: db
  MYSQL_PORT: 3306
  DATABASE_URL: mysql+pymysql://root:team3@db:3306/march_madness_betting

#####################################
############## Services #############
#####################################
services:
  - name: docker:20.10.16-dind
    alias: docker

#####################################
############## Linting ##############
#####################################
lint_backend:
  stage: lint
  image: python
  before_script:
    - pip install -r src/backend/requirements.txt
    - pip install black 
    - pip install flake8
  script:
    - black ./src/backend --check --verbose --diff --color
    - flake8 ./src/backend --max-line-length=88
  tags:
    - dind
  allow_failure: true

lint_frontend:
  stage: lint
  image: node:18
  before_script:
    - cd src/frontend-mm_app
    - npm install

  script:
    - npm run lint
  tags:
    - dind
  allow_failure: true

#####################################
########## Static Analysis ##########
#####################################
static_analysis_backend:
  stage: static_analysis
  image: python:3.9
  before_script:
    - pip install -r src/backend/requirements.txt
  script:
    - mypy src/backend
  tags:
    - dind
  allow_failure: true

#####################################
############## Testing ##############
#####################################
test_backend:
  stage: test
  image: python:3.9
  services:
    - name: mysql:latest
      alias: db
      command: [ "--default-authentication-plugin=mysql_native_password" ]
  before_script:
    - pip install -r src/backend/requirements.txt
    - sleep 10  # Give MySQL time to initialize
    - python -m flask db upgrade  # Apply migrations
  script:
    - pytest src/backend/tests/ --cov=src/backend/
  after_script:
    - coverage report
    - coverage xml > src/backend/coverage.xml
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: src/backend/coverage.xml
  tags:
    - dind
  allow_failure: true

test_frontend:
  stage: test
  image: node:18
  before_script:
    - cd src/frontend-mm_app
    - npm install
  script:
    - npm test -- --coverage
  tags:
    - dind
  allow_failure: true

#####################################
############## Build ################
#####################################
build_backend:
  stage: build
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker build -t backend:latest ./src/backend
  artifacts:
    paths:
      - src/backend
  tags:
    - dind
  allow_failure: true

build_frontend:
  stage: build
  image: node:18
  before_script:
    - cd src/frontend-mm_app
    - npm install
  script:
    - npm run build
  artifacts:
    paths:
      - src/frontend-mm_app/dist
  tags:
    - dind
  allow_failure: true

#####################################
########## Build & Release ##########
#####################################
release:
  stage: release
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker-compose -f docker-compose.yml build
    - docker tag backend:latest $CI_REGISTRY_IMAGE/backend:$RELEASE_TAG
    - docker tag frontendReact:latest $CI_REGISTRY_IMAGE/frontend:$RELEASE_TAG
    - docker push $CI_REGISTRY_IMAGE/backend:$RELEASE_TAG
    - docker push $CI_REGISTRY_IMAGE/frontend:$RELEASE_TAG
  tags:
    - dind
  only:
    - main
